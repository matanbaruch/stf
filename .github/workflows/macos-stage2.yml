name: macOS arm64 stage 2

# Stage 2: can a GitHub-hosted macOS runner boot an arm64-v8a Android 17 image?
# One fixed image (37.0 google_apis arm64-v8a, stable) across every macOS runner
# label, to find which host boots it inside a 10 minute budget.
# Standard labels only - never an -xlarge larger runner, which bills on public repos.
on:
  # push trigger removed: this probe has run. Dispatch explicitly if needed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-14, macos-15, macos-26, xcode-27]
    steps:
      - uses: actions/checkout@v5

      - name: Host + HVF
        run: |
          set +e
          echo "uname -m : $(uname -m)"; sw_vers 2>&1
          echo "ncpu=$(sysctl -n hw.ncpu) mem=$(sysctl -n hw.memsize)"
          sysctl kern.hv_vmm_present 2>&1
          df -h / 2>&1 | tail -2
          exit 0

      - name: Boot the emulator and read logcat
        id: emu
        continue-on-error: true
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          LEG_ID: ${{ matrix.runner }}
          LEG_API: "37.0"
          LEG_TARGET: google_apis
          LEG_GPU: swiftshader_indirect
          LEG_EXTRA: "arm64-v8a host=${{ matrix.runner }}"
        with:
          api-level: "37.0"
          target: google_apis
          arch: arm64-v8a
          channel: stable
          profile: pixel_2
          cores: 2
          # The runner has ~7.5G total, so 4096M as used by the x86_64 CI legs
          # leaves little headroom. 3072M is ample for Android 17 to boot.
          ram-size: 3072M
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -camera-back none -camera-front none -verbose
          script: bash .github/scripts/gpu-probe.sh

      - name: Emulator step outcome
        if: always()
        run: echo "emulator step outcome = ${{ steps.emu.outcome }}"

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-stage2-${{ matrix.runner }}
          path: out
          retention-days: 5
          if-no-files-found: warn
