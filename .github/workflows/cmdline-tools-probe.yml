name: cmdline-tools probe

# Stage 1 + the AVD half of stage 2. No emulator boot, so this is cheap.
# Hypothesis (upstream issuetracker 546200928): outdated cmdline-tools cannot
# parse a dotted API level like 37.1, so avdmanager writes target=android-0,
# which mis-configures gfxstream and leads to the mapper.ranchu SIGABRT.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_AVD_HOME: /home/runner/.android/avd

jobs:
  avd-target:
    name: cmdline-tools revision and AVD target
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Shipped cmdline-tools revisions
        run: |
          set +e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          echo "HOME=$HOME"
          for d in "$SDK"/cmdline-tools/*/; do
            printf '%-64s %s\n' "$d" "$(grep -m1 '^Pkg.Revision' "$d/source.properties" 2>/dev/null)"
          done
          exit 0

      - name: Install the system images
        timeout-minutes: 20
        run: |
          set +e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1
          yes | "$SDKM" --install "system-images;android-37.1;google_apis_ps16k;x86_64" > /dev/null 2>&1
          echo "37.1 install rc=$?"
          yes | "$SDKM" --install "system-images;android-36;default;x86_64" > /dev/null 2>&1
          echo "36 install rc=$?"
          exit 0

      - name: STAGE 1 - AVDs with the SHIPPED tools (rev 12.0)
        run: |
          set +e
          bash .github/scripts/avd-target.sh old
          exit 0

      - name: Update cmdline-tools in place (beat the latest-2 trap)
        timeout-minutes: 15
        run: |
          set +e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          # The action hardcodes $ANDROID_HOME/cmdline-tools/latest on PATH
          # (sdk-installer.ts:41) and calls bare `avdmanager`, so a sibling
          # latest-2 from `sdkmanager --install cmdline-tools;latest` would be
          # ignored. Replace `latest` itself.
          cd /tmp || exit 0
          curl -fsSLo ct.zip https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
          echo "download rc=$? size=$(stat -c%s ct.zip 2>/dev/null)"
          rm -rf /tmp/ctx && mkdir -p /tmp/ctx && unzip -q ct.zip -d /tmp/ctx
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/ctx/cmdline-tools "$SDK/cmdline-tools/latest"
          for d in "$SDK"/cmdline-tools/*/; do
            printf '%-64s %s\n' "$d" "$(grep -m1 '^Pkg.Revision' "$d/source.properties" 2>/dev/null)"
          done
          exit 0

      - name: STAGE 2 - AVDs with the NEW tools (rev 23.0)
        run: |
          set +e
          bash .github/scripts/avd-target.sh new
          exit 0

      - name: VERDICT - target= side by side
        run: |
          set +e
          echo "AVD                      target="
          for n in old-371 old-36 new-371 new-36; do
            f="$ANDROID_AVD_HOME/$n.ini"
            printf '%-24s %s\n' "$n" "$(grep -m1 '^target=' "$f" 2>/dev/null || echo '<no ini>')"
          done
          exit 0
