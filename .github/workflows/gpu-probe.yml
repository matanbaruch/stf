name: GPU probe

# Throwaway diagnostic: does a different -gpu mode or emulator binary stop
# SurfaceFlinger aborting on the Android 17 images? No STF, no rethinkdb, no
# Playwright - just boot the emulator and read logcat.
#
# push-triggered because this file does not exist on the default branch, so
# workflow_dispatch cannot reach it.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          # --- 37.2 GA (dev-channel image), gpu sweep on the default emulator ---
          - {id: "01-ga-swiftshader",       api: "37.2",       channel: "dev",    gpu: "swiftshader_indirect", emubuild: ""}
          - {id: "02-ga-swangle",           api: "37.2",       channel: "dev",    gpu: "swangle_indirect",     emubuild: ""}
          - {id: "03-ga-guest",             api: "37.2",       channel: "dev",    gpu: "guest",                emubuild: ""}
          - {id: "04-ga-auto",              api: "37.2",       channel: "dev",    gpu: "auto",                 emubuild: ""}
          # --- 37.2 GA on the STABLE emulator binary (37.1.11) : the host-side knob ---
          - {id: "05-ga-swiftshader-emu15917651", api: "37.2", channel: "dev",    gpu: "swiftshader_indirect", emubuild: "15917651"}
          - {id: "06-ga-swangle-emu15917651",     api: "37.2", channel: "dev",    gpu: "swangle_indirect",     emubuild: "15917651"}
          # --- controls ---
          - {id: "07-beta3-swiftshader",    api: "37.2-beta3", channel: "stable", gpu: "swiftshader_indirect", emubuild: ""}
          - {id: "08-371-swiftshader",      api: "37.1",       channel: "stable", gpu: "swiftshader_indirect", emubuild: ""}
          - {id: "09-371-swangle",          api: "37.1",       channel: "stable", gpu: "swangle_indirect",     emubuild: ""}
          # --- does the NEWER dev emulator fix 37.1? ---
          - {id: "10-371-swiftshader-emu16195039", api: "37.1", channel: "stable", gpu: "swiftshader_indirect", emubuild: "16195039"}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/share/boost /usr/local/lib/android/sdk/ndk \
            /usr/local/share/powershell 2>/dev/null || true
          docker image prune -af 2>/dev/null || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30 || true
          test -w /dev/kvm || sudo chmod 666 /dev/kvm
          test -w /dev/kvm

      - name: Boot the emulator and read logcat
        id: emu
        continue-on-error: true
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          LEG_ID: ${{ matrix.id }}
          LEG_API: ${{ matrix.api }}
          LEG_GPU: ${{ matrix.gpu }}
          LEG_EMUBUILD: ${{ matrix.emubuild }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis_ps16k
          arch: x86_64
          channel: ${{ matrix.channel }}
          emulator-build: ${{ matrix.emubuild }}
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: >-
            -no-window -gpu ${{ matrix.gpu }} -no-snapshot -noaudio
            -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/gpu-probe.sh

      - name: Emulator step outcome
        if: always()
        run: echo "emulator step outcome = ${{ steps.emu.outcome }}"

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gpu-probe-${{ matrix.id }}
          path: out
          retention-days: 5
          if-no-files-found: warn
