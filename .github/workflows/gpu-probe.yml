name: GPU probe

# Throwaway diagnostic for the Android 17 SurfaceFlinger abort
#   Assertion failed: !rcEnc->featureInfo()->hasReadColorBufferDma
# No STF, no rethinkdb, no Playwright - boot the emulator and read logcat.
#
# push-triggered because this file does not exist on the default branch, so
# workflow_dispatch cannot reach it.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          # === Option 1: turn OFF the host GLDMA feature the guest asserts against.
          # Built on the gpu modes that actually boot GA (guest / auto).
          - {id: "A0-ga-guest-control",    api: "37.2", target: "google_apis_ps16k", channel: "dev",    gpu: "guest", extra: ""}
          - {id: "A1-ga-guest-noGLDMA",    api: "37.2", target: "google_apis_ps16k", channel: "dev",    gpu: "guest", extra: "-feature -GLDMA"}
          - {id: "A2-ga-guest-noGLDMA12",  api: "37.2", target: "google_apis_ps16k", channel: "dev",    gpu: "guest", extra: "-feature -GLDMA,-GLDMA2"}
          - {id: "A3-ga-auto-noGLDMA",     api: "37.2", target: "google_apis_ps16k", channel: "dev",    gpu: "auto",  extra: "-feature -GLDMA"}
          # Does the emulator reject an unknown -feature name? Establishes whether
          # silence on -GLDMA means "accepted" or "ignored".
          - {id: "A4-ga-guest-bogusfeat",  api: "37.2", target: "google_apis_ps16k", channel: "dev",    gpu: "guest", extra: "-feature -ZZNOTAREALFEATURE"}

          # === Option 2: the 37.0 variant pair. Same SDK level, same channel,
          # same rev 6, only the mapper variant differs -> isolates ps16k.
          - {id: "B1-370-plain-swiftshader",  api: "37.0", target: "google_apis",       channel: "stable", gpu: "swiftshader_indirect", extra: ""}
          - {id: "B2-370-ps16k-swiftshader",  api: "37.0", target: "google_apis_ps16k", channel: "stable", gpu: "swiftshader_indirect", extra: ""}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/share/boost /usr/local/lib/android/sdk/ndk \
            /usr/local/share/powershell 2>/dev/null || true
          docker image prune -af 2>/dev/null || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30 || true
          test -w /dev/kvm || sudo chmod 666 /dev/kvm
          test -w /dev/kvm

      - name: Boot the emulator and read logcat
        id: emu
        continue-on-error: true
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          LEG_ID: ${{ matrix.id }}
          LEG_API: ${{ matrix.api }}
          LEG_TARGET: ${{ matrix.target }}
          LEG_GPU: ${{ matrix.gpu }}
          LEG_EXTRA: ${{ matrix.extra }}
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          channel: ${{ matrix.channel }}
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          # ci.yml uses 6G; keep it so a boot timeout here is comparable to the
          # real leg rather than a side effect of a smaller userdata partition.
          disk-size: 6G
          emulator-boot-timeout: 900
          disable-animations: false
          # -verbose so the emulator dumps its resolved Advanced Feature Flags,
          # which is the only way to prove -feature actually took effect.
          emulator-options: >-
            -no-window -gpu ${{ matrix.gpu }} -no-snapshot -noaudio
            -no-boot-anim -camera-back none -camera-front none
            -verbose ${{ matrix.extra }}
          script: bash .github/scripts/gpu-probe.sh

      - name: Emulator step outcome
        if: always()
        run: echo "emulator step outcome = ${{ steps.emu.outcome }}"

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gpu-probe-${{ matrix.id }}
          path: out
          retention-days: 5
          if-no-files-found: warn
