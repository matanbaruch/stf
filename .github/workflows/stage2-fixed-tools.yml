name: Stage 2 fixed tools

# Boot the three x86_64 Android 17 images with UPDATED cmdline-tools and count
# mapper.ranchu aborts. Stage 1 proved ubuntu-24.04 ships cmdline-tools 12.0,
# which writes target=android-0 for a dotted API level; rev 23.0 writes
# target=android-37.1. Expectation here: zero aborts.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_AVD_HOME: /home/runner/.android/avd

jobs:
  boot:
    name: ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {id: "F1-370-google_apis",  api: "37.0", target: "google_apis",       channel: "stable"}
          - {id: "F2-371-ps16k",        api: "37.1", target: "google_apis_ps16k", channel: "stable"}
          - {id: "F3-372ga-ps16k",      api: "37.2", target: "google_apis_ps16k", channel: "dev"}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/share/boost /usr/local/lib/android/sdk/ndk \
            /usr/local/share/powershell 2>/dev/null || true
          docker image prune -af 2>/dev/null || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30 || true
          test -w /dev/kvm || sudo chmod 666 /dev/kvm
          test -w /dev/kvm

      # THE FIX. Must run BEFORE the emulator action, which creates the AVD with
      # whatever avdmanager sits at $ANDROID_HOME/cmdline-tools/latest
      # (hardcoded on PATH at sdk-installer.ts:41). Replacing `latest` in place
      # is what makes the action pick the new tools up; installing via
      # `sdkmanager --install cmdline-tools;latest` would land in a sibling
      # latest-2 and be ignored.
      - name: Update cmdline-tools in place
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "before: $(grep -m1 '^Pkg.Revision' "$SDK/cmdline-tools/latest/source.properties" 2>/dev/null)"
          cd /tmp
          curl -fsSLo ct.zip https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
          rm -rf /tmp/ctx && mkdir -p /tmp/ctx && unzip -q ct.zip -d /tmp/ctx
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/ctx/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "after : $(grep -m1 '^Pkg.Revision' "$SDK/cmdline-tools/latest/source.properties")"
          "$SDK/cmdline-tools/latest/bin/avdmanager" list target 2>&1 | head -5 || true

      - name: Boot the emulator and read logcat
        id: emu
        continue-on-error: true
        timeout-minutes: 50
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          LEG_ID: ${{ matrix.id }}
          LEG_API: ${{ matrix.api }}
          LEG_TARGET: ${{ matrix.target }}
          LEG_GPU: swiftshader_indirect
          LEG_EXTRA: "cmdline-tools 23.0"
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          channel: ${{ matrix.channel }}
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          disk-size: 6G
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/gpu-probe.sh

      - name: Emulator step outcome
        if: always()
        run: echo "emulator step outcome = ${{ steps.emu.outcome }}"

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stage2-fixed-${{ matrix.id }}
          path: out
          retention-days: 5
          if-no-files-found: warn
